services:
  mysql:
    image: mysql:8.4
    container_name: db-fault-diagnosis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: shop_app
      MYSQL_PASSWORD: shop_app
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-fault-diagnosis-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-fault-diagnosis-mysql-data:
